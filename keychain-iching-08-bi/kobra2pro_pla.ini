# PrusaSlicer 2.7 config: Anycubic Kobra 2 Pro, 0.4 nozzle, PLA, 0.2 mm layers
# Tuned for crisp raised text on the top surface of the keychain pieces.

# --- printer
gcode_flavor = marlin2
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
use_relative_e_distances = 1
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 5000
machine_max_acceleration_x = 5000
machine_max_acceleration_y = 5000
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
retract_length = 0.8
retract_speed = 35
deretract_speed = 35
retract_before_travel = 1.5
retract_lift = 0.2
wipe = 1
start_gcode = ; Kobra 2 Pro start (same sequence as your previous working file)\nM140 S[first_layer_bed_temperature]\nM104 S150\nG90\nM83\nG28\nM420 S1 ; load saved bed mesh\nM190 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nM109 S[first_layer_temperature]\nM107\nG92 E0\nG1 Z0.3 F3000\nG0 X5 Y20 F9000\nG1 Y180 E12 F1500\nG0 X5.5 F3000\nG1 Y20 E12 F1500\nG1 E-0.8 F2100\nG1 Z2 F3000
layer_gcode = G92 E0
end_gcode = G1 E-2 F2100\nG1 Z{max_layer_z + 10} F3000\nG0 X0 Y200 F9000\nM104 S0\nM140 S0\nM107\nM84

# --- filament (PLA)
filament_diameter = 1.75
extrusion_multiplier = 1
temperature = 205
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
fan_always_on = 1
cooling = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 6
min_print_speed = 15

# --- print
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 25%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
perimeter_generator = arachne
thin_walls = 1
ensure_vertical_shell_thickness = 1
seam_position = rear
external_perimeters_first = 0
elefant_foot_compensation = 0.1
skirts = 1
skirt_distance = 5
skirt_height = 1

extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.42
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4

perimeter_speed = 60
external_perimeter_speed = 40
small_perimeter_speed = 25
infill_speed = 120
solid_infill_speed = 80
top_solid_infill_speed = 50
gap_fill_speed = 30
bridge_speed = 40
first_layer_speed = 25
travel_speed = 200
default_acceleration = 2000
perimeter_acceleration = 1500
external_perimeter_acceleration = 1000
infill_acceleration = 3000
top_solid_infill_acceleration = 1500
first_layer_acceleration = 800
travel_acceleration = 3000

gcode_comments = 0
gcode_label_objects = octoprint
output_filename_format = keychain_iching08_bi_kobra2pro.gcode
